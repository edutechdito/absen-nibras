<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Presensi Online Perguruan Islam NIBRAS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #F4F6F9;
      color: #0B2545;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      max-width: 420px;
      padding: 36px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(11, 37, 69, 0.08);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #EEF4F8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0B2545;
      font-size: 38px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #0B2545;
    }
    p {
      color: #64748B;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 20px;
      background: #0B2545;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #134074;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi Presensi GPS Perguruan Islam NIBRAS memerlukan koneksi internet untuk memvalidasi posisi Anda dengan server.</p>
    <button class="btn" onclick="window.location.reload()">Coba Sambungkan Ulang</button>
  </div>
</body>
</html>
